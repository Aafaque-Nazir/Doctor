<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Luxury Background Gradient -->
    <linearGradient id="auraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="55%" stop-color="#121815" />
      <stop offset="100%" stop-color="#060908" />
    </linearGradient>

    <!-- Champagne Gold Gradient for Aura Star and Smile Arc -->
    <linearGradient id="auraGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf3d6" />
      <stop offset="35%" stop-color="#e2bc72" />
      <stop offset="100%" stop-color="#b68936" />
    </linearGradient>

    <!-- Tooth Ceramic Pure White Gradient -->
    <linearGradient id="toothGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#f0f3f2" />
      <stop offset="100%" stop-color="#d9e2df" />
    </linearGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="auraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Emblem Container -->
  <rect width="512" height="512" rx="136" fill="url(#auraBg)" />
  <rect width="496" height="496" x="8" y="8" rx="128" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Subtle Ambient Glow under the Tooth -->
  <circle cx="256" cy="256" r="140" fill="#1e3d34" opacity="0.45" filter="url(#auraGlow)" />

  <!-- Modern Anatomical Dental Tooth Silhouette -->
  <path
    d="M 256 168
       C 232 136 190 132 165 154
       C 138 178 132 216 138 252
       C 146 292 164 328 196 376
       C 207 392 222 392 228 372
       C 238 340 248 316 256 316
       C 264 316 274 340 284 372
       C 290 392 305 392 316 376
       C 348 328 366 292 374 252
       C 380 216 374 178 347 154
       C 322 132 280 136 256 168 Z"
    fill="url(#toothGrad)"
    stroke="rgba(255,255,255,0.6)"
    stroke-width="3"
  />

  <!-- Gentle Smile Arc within the Tooth -->
  <path
    d="M 198 248 C 228 284 284 284 314 248"
    fill="none"
    stroke="url(#auraGold)"
    stroke-width="15"
    stroke-linecap="round"
  />

  <!-- Primary Radiant "Aura" Star (Upper Right) -->
  <g filter="url(#auraGlow)">
    <path
      d="M 378 86
         Q 378 132 424 132
         Q 378 132 378 178
         Q 378 132 332 132
         Q 378 132 378 86 Z"
      fill="url(#auraGold)"
    />
    <!-- Center Bright Dot -->
    <circle cx="378" cy="132" r="5" fill="#ffffff" />
  </g>

  <!-- Secondary Delicate Sparkle (Left Base) -->
  <path
    d="M 132 290
       Q 132 310 152 310
       Q 132 310 132 330
       Q 132 310 112 310
       Q 132 310 132 290 Z"
    fill="url(#auraGold)"
    opacity="0.85"
  />
</svg>
